# Optional: local Appium + Android emulator stack for CI or local parallel runs.
# Start with:  docker compose -f ci/docker-compose.yml up -d
services:
  appium:
    image: appium/appium:latest
    container_name: appium-server
    privileged: true
    ports:
      - "4723:4723"
    environment:
      - RELAXED_SECURITY=true

  android-emulator:
    image: budtmo/docker-android:emulator_14.0
    container_name: android-emulator
    privileged: true
    ports:
      - "6080:6080"   # noVNC web view of the device
      - "5555:5555"   # adb
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true
