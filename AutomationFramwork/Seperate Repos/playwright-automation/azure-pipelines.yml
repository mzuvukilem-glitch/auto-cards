# Azure DevOps pipeline for the Playwright (Java) framework.
# Playwright bundles its browsers, so all jobs run on standard hosted agents.

trigger:
  branches:
    include: [ main, master ]

pr:
  branches:
    include: [ '*' ]

variables:
  MAVEN_OPTS: '-Dfile.encoding=UTF-8'

stages:
  - stage: Build
    displayName: Build & compile
    jobs:
      - job: compile
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              path: $(HOME)/.m2/repository
          - script: mvn -B clean test-compile
            displayName: mvn clean test-compile

  - stage: Test
    displayName: Cross-browser tests
    dependsOn: Build
    jobs:
      - job: browsers
        timeoutInMinutes: 45
        pool:
          vmImage: ubuntu-latest
        strategy:
          matrix:
            chromium:
              BROWSER: chromium
            firefox:
              BROWSER: firefox
            webkit:
              BROWSER: webkit
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              path: $(HOME)/.m2/repository
          - script: mvn -B compile exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"
            displayName: Install Playwright browsers
          - script: mvn -B test -Dbrowser=$(BROWSER) -Dheadless=true
            displayName: Run tests ($(BROWSER))
          - script: mvn -B allure:report
            displayName: Allure report
            condition: always()
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'target/surefire-reports/TEST-*.xml'
              testRunTitle: 'Playwright $(BROWSER)'
          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              PathtoPublish: 'target/site/allure-maven-plugin'
              ArtifactName: 'allure-report-$(BROWSER)'
