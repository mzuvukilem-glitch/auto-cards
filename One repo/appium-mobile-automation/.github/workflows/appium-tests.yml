name: Appium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        type: choice
        options: [ android, ios ]
        default: android

jobs:
  # Fast, device-free validation that always runs.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile (main + test)
        run: mvn -B clean test-compile

  # Android tests on an emulator (hardware acceleration via reactivecircus action).
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event.inputs.platform != 'ios' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Fetch app binary
        run: echo "Download app-debug.apk into src/test/resources/apps/ (e.g. aws s3 cp ...)"

      - name: Run Android tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            appium --log-level warn &
            sleep 5
            mvn -B test -Dplatform=android

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-results
          path: |
            target/allure-results
            target/site/allure-maven-plugin
            screenshots/
          retention-days: 7

  # iOS tests require a macOS runner with Xcode/simulators.
  ios:
    needs: build
    runs-on: macos-14
    timeout-minutes: 60
    if: ${{ github.event.inputs.platform == 'ios' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Fetch app binary
        run: echo "Download app.ipa/.app into src/test/resources/apps/"

      - name: Start Appium and run iOS tests
        run: |
          appium --log-level warn &
          sleep 5
          mvn -B test -Dplatform=ios

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            target/allure-results
            target/site/allure-maven-plugin
            screenshots/
          retention-days: 7
