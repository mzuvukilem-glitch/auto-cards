<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Alur and Felice">
  <title>Alur &amp; Felice Planner</title>
  <!-- Same black tile as the logos in the app -->
  <rect width="64" height="64" rx="14" fill="#000"/>
  <!-- A for Alur -->
  <path d="M6.5 46 L18.5 15 L30.5 46 M11.5 36 H25.5" fill="none" stroke="#fff" stroke-width="6.5" stroke-linejoin="miter" stroke-miterlimit="4"/>
  <!-- f for Felice (italic, like its script logo) -->
  <path d="M53 14.5 C46.5 11 41.5 14 40.5 22.5 L36.5 48 M35 28.5 H51" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Each organisation's colour in the app: Alur teal, Felice indigo -->
  <rect x="8" y="53" width="22" height="5" rx="2.5" fill="#0f766e"/>
  <rect x="34" y="53" width="22" height="5" rx="2.5" fill="#4338ca"/>
</svg>
