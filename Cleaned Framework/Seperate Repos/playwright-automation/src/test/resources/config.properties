# Global framework config. Runtime -D<key>=<value> overrides these values.

# Base URL of the app under test
base.url=https://www.saucedemo.com

# Browser: chromium | firefox | webkit
browser=chromium

# Run config
headless=true
slowmo.ms=0
viewport.width=1280
viewport.height=720
# Record a video per test context (needs Playwright's bundled ffmpeg). Off by
# default so the suite runs offline; enable with -Drecord.video=true.
record.video=false

# Timeouts (ms)
default.timeout=15000
navigation.timeout=30000

# Environment
environment=qa

# Demo credentials
standard.user=standard_user
standard.password=secret_sauce

# API testing (Playwright APIRequestContext — no browser)
api.base.url=https://reqres.in
api.timeout=30000
# Optional bearer token; leave blank for public APIs. Prefer -Dapi.token=... in CI.
api.token=
