# Global framework config. Runtime -D<key>=<value> overrides these values.

# Default platform (android | ios). Override: mvn test -Dplatform=ios
platform=android

# Appium server endpoint
appium.server.url=http://127.0.0.1:4723
# Auto-start a local Appium server for the run, bound to the host/port of
# appium.server.url above. Off by default (assumes an external/cloud server);
# enable with -Dappium.server.autostart=true.
appium.server.autostart=false

# Where tests run: local (default) | browserstack | saucelabs | lambdatest | awsdevicefarm | perfecto.
# For a cloud, the hub URL is auto-derived from this value (override with -Dappium.server.url).
device.farm=local
# Optional run metadata used by cloud providers.
cloud.project=ATom Mobile
cloud.build=local-build
# Sauce Labs data-centre region (used to build the hub URL).
cloud.region=us-west-1
# Cloud credentials are secrets — never commit them. Provide at runtime via
# -Dcloud.user=... -Dcloud.key=... , env vars CLOUD_USER / CLOUD_KEY, or a .env file.
# A vendor-uploaded app can be referenced with -Dcloud.app=bs://... | storage:... | lt://...
# (Perfecto also needs -Dcloud.host=<your-cloud>.)

# Environment under test
environment=qa
base.api.url=https://qa.example.com/api
